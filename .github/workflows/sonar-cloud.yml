name: SonarCloud
on:
  push:
    branches:
      - master
      - develop
  workflow_dispatch:
jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.2.2
        ports:
          - 9200:9200
        env:
          discovery.type: single-node
          xpack.security.enabled: false
          ES_JAVA_OPTS: -Xms1g -Xmx1g
    env:
      AZURE_ENDPOINT: ${{ secrets.AZURE_ENDPOINT }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AZURE_MODEL: gpt-4
      AZURE_EMBEDDING_MODEL: text-embedding-ada-002
      TEST_MONGO_INSTANCE: mongodb://localhost/test
      ELASTIC_TEST_URL: http://localhost:9200
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:

      - name: Check actor
        run: |
          if [ "$GITHUB_ACTOR" != "alkampfergit" ]; then
            echo "Only the repository owner can run this workflow."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Check secrets
        run: |
          if [ -z "$AZURE_ENDPOINT" ]; then echo "AZURE_ENDPOINT not set"; exit 1; fi
          if [ -z "$OPENAI_API_KEY" ]; then echo "OPENAI_API_KEY not set"; exit 1; fi
          echo "All required secrets are set"

      - name: Install Dotnet Tools
        shell: pwsh
        run: |
          dotnet tool restore
          Write-Host "GitVersion.Tool installed now try the tool"
          $gv = dotnet tool run dotnet-gitversion /config .config/GitVersion.yml | Out-String | ConvertFrom-Json
          Write-Host "GitVersion.Tool output is $gv"

      - name: Setup dotnet 10
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: 10.x

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu' # Alternative distribution options are available.

      - name: Cache SonarQube Cloud packages
        uses: actions/cache@v4
        with:
          path: ~/sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarQube Cloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/scanner"
          dotnet tool update dotnet-sonarscanner --tool-path "$RUNNER_TEMP/scanner"

      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: pwsh
        run: |
          # determine branch name for Sonar (prefer PR head ref)
          $BranchName = $env:GITHUB_HEAD_REF
          if (-not $BranchName) {
            if ($env:GITHUB_REF -match '^refs/heads/(.+)$') {
              $BranchName = $Matches[1]
            }
            else {
              # fallback to the raw ref if it couldn't be parsed
              $BranchName = $env:GITHUB_REF
            }
          }
          Write-Host "Using branch name for Sonar: $BranchName"

          # prefer scanner installed in runner temp, fallback to repo-local scanner

          $scanner = Join-Path $env:RUNNER_TEMP "scanner/dotnet-sonarscanner"
          if (-not (Test-Path $scanner)) {
            $scanner = "../.sonar/scanner/dotnet-sonarscanner"
          }
          if (-not (Test-Path $scanner)) {
            throw "Sonar scanner not found in $env:RUNNER_TEMP/scanner or ../.sonar/scanner"
          }
          Write-Host "Using sonar scanner: $scanner"

          $beginArgs = @(
            'begin',
            '/k:alkampfergit_alkampfer.assistant',
            '/o:alkampfergit-github',
            "/d:sonar.token=$env:SONAR_TOKEN",
            '/d:sonar.host.url=https://sonarcloud.io',
            "/d:sonar.branch.name=$BranchName"
          )
          & $scanner @beginArgs
          if ($LASTEXITCODE -ne 0) {
            throw "Sonar scanner 'begin' failed with exit code $LASTEXITCODE"
          }

          # Debug: show .sonarqube contents if present
          if (Test-Path .sonarqube) { Get-ChildItem -Recurse -Force .sonarqube | Select-Object -First 20 }

          # Run the regular build script from the repository root
          ./build.ps1 -configuration "debug"

          # Run Sonar 'end' from the same solution folder

          $endArgs = @('end', "/d:sonar.login=$env:SONAR_TOKEN")
          Write-Host "Using sonar scanner: $scanner"
          & $scanner @endArgs
          if ($LASTEXITCODE -ne 0) {
            throw "Sonar scanner 'end' failed with exit code $LASTEXITCODE"
          }
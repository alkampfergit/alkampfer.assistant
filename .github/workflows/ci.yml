name: CI
on:
  push:
    branches:
      - master
      - develop
      - hotfix/*
      - release/*
      - feature/*
      
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.2.2
        ports:
          - 9200:9200
        env:
          discovery.type: single-node
          xpack.security.enabled: false
          ES_JAVA_OPTS: -Xms1g -Xmx1g
    env:
      AZURE_ENDPOINT: ${{ secrets.AZURE_ENDPOINT }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AZURE_MODEL: gpt-5-nano
      AZURE_EMBEDDING_MODEL: text-embedding-3-small
      TEST_MONGO_INSTANCE: mongodb://localhost:27017/test
      ELASTIC_TEST_URL: http://localhost:9200
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
   
    steps:

      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Check secrets
        run: |
          if [ -z "$AZURE_ENDPOINT" ]; then echo "AZURE_ENDPOINT not set"; exit 1; fi
          if [ -z "$OPENAI_API_KEY" ]; then echo "OPENAI_API_KEY not set"; exit 1; fi
          echo "All required secrets are set"

      - name: Install Dotnet Tools
        shell: pwsh
        run: |
          dotnet tool restore
          Write-Host "GitVersion.Tool installed now try the tool"
          $gv = dotnet tool run dotnet-gitversion /config .config/GitVersion.yml | Out-String | ConvertFrom-Json
          Write-Host "GitVersion.Tool output is $gv"

      - name: Setup dotnet 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Build and test
        shell: pwsh
        run: |
          ./build.ps1 -configuration "debug"

      - name: Flatten TRX files
        if: always()
        shell: bash
        run: |
          mkdir -p flattened-trx
          find TestResults -name "*.trx" -type f -exec cp {} flattened-trx/ \;
          echo "Found $(find flattened-trx -name '*.trx' | wc -l) TRX files"
          ls -la flattened-trx/ || true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: flattened-trx/
          if-no-files-found: warn